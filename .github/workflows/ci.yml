name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change Detection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workflows: ${{ steps.changes.outputs.workflows }}
      go: ${{ steps.changes.outputs.go }}
      container: ${{ steps.changes.outputs.container }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          workflows=false
          go=false
          container=false

          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$HEAD_SHA^"
          fi

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|.github/release-notes/tooling/*)
                workflows=true
                ;;
              *.md|LICENSE)
                ;;
              assets/*|cmd/*|internal/*|go.mod|go.sum)
                go=true
                container=true
                ;;
              Dockerfile|.dockerignore|compose*.yaml|VERSION)
                container=true
                ;;
              *)
                go=true
                container=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          {
            echo "workflows=$workflows"
            echo "go=$go"
            echo "container=$container"
          } >> "$GITHUB_OUTPUT"

  workflows:
    name: Workflow Validation
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - name: Test release-note tooling
        run: python -m unittest discover -s .github/release-notes/tooling -p '*_test.py'

  go:
    name: Go Validation
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/simple-workout

  container:
    name: Container Validation
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
