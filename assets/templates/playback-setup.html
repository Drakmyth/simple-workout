{{define "playback-setup.html"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a3212a"><title>Start {{.Workout.Name}} - Simple Workout</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="/">Simple Workout</a><nav><a href="/workouts">Workouts</a><a href="/exercises">Exercises</a></nav></header>
  <main class="playback-setup">
    <a class="back-link" href="/workouts">Back to workouts</a>
    <p class="eyebrow">Get ready</p><h1>{{.Workout.Name}}</h1>
    <form method="post" action="/workouts/{{.Workout.ID}}/play">
      <section class="card setup-section"><h2>Working weights</h2><p>Adjust today's weights before starting.</p>
        <div class="weight-list">{{range .Exercises}}<label><span>{{.Name}}</span><span class="weight-input"><input name="weight" type="number" min="0" step="any" value="{{.Weight}}" placeholder="Bodyweight"> {{$.Settings.WeightUnit}}</span></label>{{end}}</div>
      </section>
      <section class="card setup-section"><h2>Playback</h2>
        <label>Rest between sets<input name="rest_seconds" type="number" min="0" value="{{.Settings.RestSeconds}}" required> seconds</label>
        <label>Image model<select name="image_preference">
          <option value="male" {{if eq .Settings.ImagePreference "male"}}selected{{end}}>Male</option>
          <option value="female" {{if eq .Settings.ImagePreference "female"}}selected{{end}}>Female</option>
          <option value="alternating" {{if eq .Settings.ImagePreference "alternating"}}selected{{end}}>Alternating</option>
          <option value="random" {{if eq .Settings.ImagePreference "random"}}selected{{end}}>Random</option>
        </select></label>
        <label class="checkbox-label"><input name="keep_screen_on" type="checkbox" value="true" {{if .Settings.KeepScreenOn}}checked{{end}}> Keep screen on</label>
        <label class="checkbox-label"><input name="save_weights" type="checkbox" value="true" checked> Save these weights after completing the workout</label>
      </section>
      <button class="start-workout" type="submit">Start workout</button>
    </form>
  </main>
</body>
</html>{{end}}
