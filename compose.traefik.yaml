services:
  app:
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-proxy}"
      traefik.http.routers.simple-workout.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.simple-workout.rule: "Host(`${APP_HOST:?Set APP_HOST in .env}`)"
      traefik.http.routers.simple-workout.tls: "true"
      traefik.http.services.simple-workout.loadbalancer.server.port: "8080"
    networks:
      - default
      - traefik

networks:
  traefik:
    external: true
    name: "${TRAEFIK_NETWORK:-proxy}"
